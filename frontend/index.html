<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Token</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ocean" id="ocean"></div>

  <div class="container">
    <div class="card">
      <header class="card-header">
        <h1>Gerador de Token</h1>
      </header>

      <div class="params-group">
        <div class="param">
          <label for="qtd-caracteres">Caracteres</label>
          <input type="number" id="qtd-caracteres" min="1" max="256" value="12" placeholder="12">
        </div>
        <div class="param">
          <label for="qtd-tokens">Quantidade</label>
          <input type="number" id="qtd-tokens" min="1" max="100" value="1" placeholder="1">
        </div>
      </div>

      <label class="token-label">Token</label>

      <div class="input-group">
        <input type="text" id="campo-backend" readonly placeholder="carregando...">
        <button id="btn-copiar">Copiar</button>
        <button id="btn-gerar">Gerar</button>
      </div>
    </div>
  </div>

  <svg class="wave wave--back" viewBox="0 0 1440 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,70 C180,20 360,120 540,70 C720,20 900,120 1080,70 C1260,20 1350,90 1440,70 L1440,140 L0,140 Z"/>
  </svg>
  <svg class="wave wave--front" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,55 C200,95 400,15 600,55 C800,95 1000,15 1200,55 C1320,75 1380,45 1440,55 L1440,120 L0,120 Z"/>
  </svg>

  <script src="script.js"></script>
</body>
</html>
